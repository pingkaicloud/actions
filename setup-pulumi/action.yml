name: setup-pulumi
description: >
  Make the requested Pulumi CLI available for the job: reuse it from the
  shared runner tool cache (NAS-backed RUNNER_TOOL_CACHE) when present, then
  run pulumi/actions@v6 in install-only mode. On a cache hit that install is
  a no-op ("already installed ... Skipping download", no api.pulumi.com
  access); on a miss it installs as usual and registers the version into the
  tool cache, warming it for later jobs. Either way pulumi is on GITHUB_PATH
  for the rest of the job, so later pulumi/actions preview/up steps also skip
  their reinstall.

inputs:
  pulumi-version:
    description: >
      Exact Pulumi CLI version, e.g. 3.228.0. A leading "v" is accepted.
      Must match the version pinned by the pulumi/actions steps in the job.
    required: true

runs:
  using: composite
  steps:
    - name: Reuse cached Pulumi if present
      shell: bash
      env:
        PULUMI_VERSION_INPUT: ${{ inputs.pulumi-version }}
      run: |
        set -euo pipefail

        version="${PULUMI_VERSION_INPUT#v}"
        case "$version" in
          ''|*[!0-9.]*) echo "::error::invalid pulumi-version: ${PULUMI_VERSION_INPUT}" && exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)" && exit 1 ;;
        esac

        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        dest="$cache_root/pulumi/$version/$arch"

        if [ -x "$dest/pulumi" ] && [ "$("$dest/pulumi" version 2>/dev/null)" = "v$version" ]; then
          echo "$dest" >> "$GITHUB_PATH"
          echo "Reusing cached pulumi v$version at $dest (added to GITHUB_PATH)"
        else
          echo "pulumi v$version not found in tool cache ($dest); pulumi/actions will install it"
        fi

    - name: Install Pulumi CLI
      uses: pulumi/actions@v6
      with:
        pulumi-version: ${{ inputs.pulumi-version }}
