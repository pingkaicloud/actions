name: setup-pulumi
description: >
  Reuse the Pulumi CLI from the shared runner tool cache (NAS-backed
  RUNNER_TOOL_CACHE): when the requested version is present, prepend its
  binary directory to GITHUB_PATH so the first pulumi/actions@v6 call of the
  job hits its "already installed" fast path and skips the delete/re-download
  cycle (and its dependency on api.pulumi.com connectivity). When the version
  is not cached, this action does nothing; pulumi/actions installs as usual
  and its own tool-cache registration makes future jobs hit the fast path.

inputs:
  pulumi-version:
    description: >
      Exact Pulumi CLI version, e.g. 3.228.0. A leading "v" is accepted.
      Must match the version pinned by the pulumi/actions steps in the job.
    required: true

runs:
  using: composite
  steps:
    - name: Reuse cached Pulumi if present
      shell: bash
      env:
        PULUMI_VERSION_INPUT: ${{ inputs.pulumi-version }}
      run: |
        set -euo pipefail

        version="${PULUMI_VERSION_INPUT#v}"
        case "$version" in
          ''|*[!0-9.]*) echo "::error::invalid pulumi-version: ${PULUMI_VERSION_INPUT}" && exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)" && exit 1 ;;
        esac

        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        dest="$cache_root/pulumi/$version/$arch"

        if [ -x "$dest/pulumi" ] && [ "$("$dest/pulumi" version 2>/dev/null)" = "v$version" ]; then
          echo "$dest" >> "$GITHUB_PATH"
          echo "Reusing cached pulumi v$version at $dest (added to GITHUB_PATH)"
        else
          echo "pulumi v$version not found in tool cache ($dest); pulumi/actions will install it"
        fi
