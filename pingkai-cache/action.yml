name: pingkai-cache
description: >
  OSS-backed cache for the CN self-hosted runner pools, wrapping the pinned
  runs-on/cache fork with actions/cache path/key/restore-keys semantics.
  Credentials are supplied as inputs (pass the org-level GitHub secrets).
  The backend (bucket/endpoint/region) defaults to the org CN-Shanghai OSS
  cache and can be overridden by PINGKAI_CACHE_* environment variables
  (org-level variables or runner-level injection, e.g. per-pool endpoints).
  Objects are laid out as cache/<repo>/<version>/<key>; per-repo isolation
  and prefix-matched restore keys are built in.

inputs:
  path:
    description: >
      Path(s) to cache and restore, newline-delimited for multiple paths
      (same semantics as actions/cache).
    required: true
  key:
    description: >
      Primary cache key used for restore and save (same semantics as
      actions/cache).
    required: true
  restore-keys:
    description: >
      Ordered prefix-matched keys used for restoration when the primary key
      misses (same semantics as actions/cache).
    default: ""
  access-key-id:
    description: >
      OSS access key id. Pass the org-level secret
      secrets.PINGKAI_CACHE_ACCESS_KEY_ID. Credentials must never be
      provided via environment variables.
    required: true
  secret-access-key:
    description: >
      OSS secret access key. Pass the org-level secret
      secrets.PINGKAI_CACHE_SECRET_ACCESS_KEY.
    required: true
  bucket:
    description: >
      OSS bucket; defaults to the org CN-Shanghai runner cache bucket.
      A PINGKAI_CACHE_BUCKET env var, when set, overrides this default.
    default: github-runner-cache
  endpoint:
    description: >
      S3-compatible endpoint; defaults to the Aliyun OSS internal endpoint
      for CN-Shanghai. A PINGKAI_CACHE_ENDPOINT env var, when set, overrides
      this default.
    default: https://oss-cn-shanghai-internal.aliyuncs.com
  region:
    description: >
      SigV4 signing region; defaults to cn-shanghai. A PINGKAI_CACHE_REGION
      env var, when set, overrides this default.
    default: cn-shanghai

runs:
  using: composite
  steps:
    - name: Wire up the OSS cache backend
      shell: bash
      env:
        OSS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        OSS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_REGION: ${{ inputs.region }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Env wins over the baked-in defaults so pools can inject per-region
        # backends (Shanghai OSS vs TKE COS) without every workflow opting in.
        bucket="${PINGKAI_CACHE_BUCKET:-${INPUT_BUCKET:-}}"
        endpoint="${PINGKAI_CACHE_ENDPOINT:-${INPUT_ENDPOINT:-}}"
        region="${PINGKAI_CACHE_REGION:-${INPUT_REGION:-cn-shanghai}}"
        path_style="${PINGKAI_CACHE_PATH_STYLE:-false}"

        if [ -z "${bucket}" ] || [ -z "${endpoint}" ]; then
          echo "::error::No cache backend resolved: bucket/endpoint are empty in both PINGKAI_CACHE_* env vars and action defaults. See pingkai-cache/README.md."
          exit 1
        fi

        if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_SECRET_ACCESS_KEY:-}" ]; then
          echo "::error::access-key-id and secret-access-key inputs are required. Pass the org-level secrets PINGKAI_CACHE_ACCESS_KEY_ID / PINGKAI_CACHE_SECRET_ACCESS_KEY in the with block."
          exit 1
        fi

        if [ -n "${RUNS_ON_RUNNER_NAME:-}" ]; then
          echo "::warning::RUNS_ON_RUNNER_NAME is set; runs-on/cache will drop static AWS credentials in favor of the instance profile."
        fi

        # Normalize the endpoint for the AWS SDK: it requires a scheme, and the
        # bucket must not be baked into the hostname (virtual-hosted addressing
        # prepends the bucket itself). Tolerate both misconfigurations.
        case "${endpoint}" in
          http://*|https://*) ;;
          *) endpoint="https://${endpoint}" ;;
        esac
        bucket_prefix="${bucket}."
        endpoint_host="${endpoint#*://}"
        if [ "${endpoint_host#${bucket_prefix}}" != "${endpoint_host}" ]; then
          endpoint="${endpoint%%://*}://${endpoint_host#${bucket_prefix}}"
        fi

        # runs-on/cache reads standard AWS credentials plus its RUNS_ON_S3_*
        # knobs from the process environment. Writing them to GITHUB_ENV makes
        # them visible to the nested action step and everything later in the job.
        {
          echo "AWS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${OSS_SECRET_ACCESS_KEY}"
          echo "AWS_REGION=${region}"
          echo "RUNS_ON_S3_BUCKET_CACHE=${bucket}"
          echo "RUNS_ON_S3_BUCKET_ENDPOINT=${endpoint}"
          echo "RUNS_ON_S3_FORCE_PATH_STYLE=${path_style}"
        } >> "$GITHUB_ENV"

        echo "OSS cache backend: bucket=${bucket} endpoint=${endpoint} region=${region} path-style=${path_style}"

        # runs-on/cache swallows backend errors into a silent cache miss, so a
        # misconfigured backend surfaces only as a wasted cold build. Probe the
        # backend once here: deterministic config errors (bad credentials,
        # missing bucket, denied policy) fail the job immediately; transient
        # issues stay warnings to keep the cache best-effort.
        node_bin="$(command -v node || true)"
        if [ -z "${node_bin}" ]; then
          # The runner image keeps its Node runtimes under <runner-root>/externals,
          # not on PATH for shell steps; RUNNER_TEMP is <runner-root>/_work/_temp.
          runner_root="${RUNNER_TEMP:-/home/runner}"
          runner_root="${runner_root%/_work/_temp}"
          for cand in "${runner_root}/externals/node"*/bin/node; do
            if [ -x "${cand}" ]; then
              node_bin="${cand}"
              break
            fi
          done
        fi
        if [ -n "${node_bin}" ]; then
          echo "cache backend preflight via ${node_bin}"
          PINGKAI_CACHE_CHECK_ENDPOINT="${endpoint}" \
          PINGKAI_CACHE_BUCKET="${bucket}" \
          PINGKAI_CACHE_REGION="${region}" \
          PINGKAI_CACHE_PATH_STYLE="${path_style}" \
          AWS_ACCESS_KEY_ID="${OSS_ACCESS_KEY_ID}" \
          AWS_SECRET_ACCESS_KEY="${OSS_SECRET_ACCESS_KEY}" \
          "${node_bin}" "${ACTION_PATH}/check-backend.mjs"
        else
          echo "::warning::node not found on PATH or under the runner's externals; skipping the cache backend preflight"
        fi

    - name: Restore and save cache (runs-on/cache, pinned)
      uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26 # v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
