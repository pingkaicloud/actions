name: setup-terraform
description: Reuse Terraform CLI from the runner tool cache, installing with hashicorp/setup-terraform@v3 on a miss.

inputs:
  cli_config_credentials_hostname:
    description: 'The hostname of a HCP Terraform/Terraform Enterprise instance to place within the credentials block of the Terraform CLI configuration file. Defaults to `app.terraform.io`.'
    default: 'app.terraform.io'
    required: false
  cli_config_credentials_token:
    description: 'The API token for a HCP Terraform/Terraform Enterprise instance to place within the credentials block of the Terraform CLI configuration file.'
    required: false
  terraform_version:
    description: 'The version of Terraform CLI to install. Instead of full version string you can also specify constraint string starting with "<" (for example `<1.13.0`) to install the latest version satisfying the constraint. A value of `latest` will install the latest version of Terraform CLI. Defaults to `latest`.'
    default: 'latest'
    required: false
  terraform_wrapper:
    description: 'Whether or not to install a wrapper to wrap subsequent calls of the `terraform` binary and expose its STDOUT, STDERR, and exit code as outputs named `stdout`, `stderr`, and `exitcode` respectively. Defaults to `true`.'
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    - id: cache
      name: Reuse cached Terraform if present
      shell: bash
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform_version }}
        TERRAFORM_WRAPPER: ${{ inputs.terraform_wrapper }}
      run: |
        set -euo pipefail
        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        version="${TERRAFORM_VERSION#v}"
        wrapper=false
        if [ "$TERRAFORM_WRAPPER" = true ]; then wrapper=true; fi
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

        # Let upstream resolve moving versions on every run.
        dest="$cache_root/terraform/downloads"
        if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          dest="$cache_root/terraform/$version/$arch/wrapper-$wrapper"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        fi
        mkdir -p "$dest"
        echo "dest=$dest" >> "$GITHUB_OUTPUT"

        binary=terraform
        if [ "$TERRAFORM_WRAPPER" = true ]; then binary=terraform-bin; fi
        if [ -x "$dest/terraform" ] && [ -x "$dest/$binary" ] && [ "$(CHECKPOINT_DISABLE=1 "$dest/$binary" version 2>/dev/null | head -n 1)" = "Terraform v$version" ]; then
          echo "$dest" >> "$GITHUB_PATH"
          if [ "$TERRAFORM_WRAPPER" = true ]; then
            echo "TERRAFORM_CLI_PATH=$dest" >> "$GITHUB_ENV"
          fi
          echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          echo "Reusing cached Terraform v$version at $dest"
        fi

    - name: Configure credentials on cache hit
      if: steps.cache.outputs.cache-hit == 'true' && inputs.cli_config_credentials_hostname != '' && inputs.cli_config_credentials_token != ''
      shell: bash
      env:
        CREDENTIALS_HOSTNAME: ${{ inputs.cli_config_credentials_hostname }}
        CREDENTIALS_TOKEN: ${{ inputs.cli_config_credentials_token }}
      run: |
        set -euo pipefail
        config_file="${TF_CLI_CONFIG_FILE:-$HOME/.terraformrc}"
        mkdir -p "$(dirname "$config_file")"
        umask 077
        printf 'credentials "%s" {\n  token = "%s"\n}\n' \
          "$CREDENTIALS_HOSTNAME" "$CREDENTIALS_TOKEN" > "$config_file"

    - name: Install Terraform CLI
      if: steps.cache.outputs.cache-hit != 'true'
      uses: hashicorp/setup-terraform@v3
      env:
        RUNNER_TEMP: ${{ steps.cache.outputs.dest }}
      with:
        cli_config_credentials_hostname: ${{ inputs.cli_config_credentials_hostname }}
        cli_config_credentials_token: ${{ inputs.cli_config_credentials_token }}
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: ${{ inputs.terraform_wrapper }}

    - name: Save Terraform CLI to tool cache
      if: steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cacheable == 'true'
      shell: bash
      env:
        TERRAFORM_CACHE_DIR: ${{ steps.cache.outputs.dest }}
        TERRAFORM_WRAPPER: ${{ inputs.terraform_wrapper }}
      run: |
        set -euo pipefail
        source_dir="$(dirname "$(command -v terraform)")"
        cp "$source_dir/terraform" "$TERRAFORM_CACHE_DIR/terraform"
        if [ "$TERRAFORM_WRAPPER" = true ]; then
          cp "$source_dir/terraform-bin" "$TERRAFORM_CACHE_DIR/terraform-bin"
          echo "TERRAFORM_CLI_PATH=$TERRAFORM_CACHE_DIR" >> "$GITHUB_ENV"
        fi
        echo "$TERRAFORM_CACHE_DIR" >> "$GITHUB_PATH"
