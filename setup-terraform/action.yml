name: setup-terraform
description: >
  Reuse Terraform CLI from the shared runner tool cache when present.
  On a miss, install with hashicorp/setup-terraform@v3 and save it for later jobs.

inputs:
  terraform-version:
    description: Exact Terraform CLI version, e.g. 1.9.8. A leading "v" is accepted.
    required: true

runs:
  using: composite
  steps:
    - id: cache
      name: Reuse cached Terraform if present
      shell: bash
      env:
        TERRAFORM_VERSION_INPUT: ${{ inputs.terraform-version }}
      run: |
        set -euo pipefail

        version="${TERRAFORM_VERSION_INPUT#v}"
        case "$version" in
          ''|*[!0-9.]*) echo "::error::invalid terraform-version: ${TERRAFORM_VERSION_INPUT}" && exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)" && exit 1 ;;
        esac

        cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        dest="$cache_root/terraform/$version/$arch"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dest=$dest" >> "$GITHUB_OUTPUT"

        if [ -x "$dest/terraform" ] && [ "$(CHECKPOINT_DISABLE=1 "$dest/terraform" version 2>/dev/null | head -n 1)" = "Terraform v$version" ]; then
          echo "$dest" >> "$GITHUB_PATH"
          echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          echo "Reusing cached Terraform v$version at $dest (added to GITHUB_PATH)"
        else
          echo "Terraform v$version not found in tool cache ($dest); hashicorp/setup-terraform will install it"
        fi

    - name: Install Terraform CLI
      if: steps.cache.outputs.cache-hit != 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ steps.cache.outputs.version }}
        terraform_wrapper: false

    - name: Save Terraform CLI to tool cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TERRAFORM_CACHE_DIR: ${{ steps.cache.outputs.dest }}
      run: |
        set -euo pipefail
        mkdir -p "$TERRAFORM_CACHE_DIR"
        cp "$(command -v terraform)" "$TERRAFORM_CACHE_DIR/terraform"
        echo "$TERRAFORM_CACHE_DIR" >> "$GITHUB_PATH"
