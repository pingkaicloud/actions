name: setup-terraform
description: >
  Reuse Terraform CLI from the shared runner tool cache. On a cache miss,
  install with hashicorp/setup-terraform@v3 and persist the CLI and optional
  wrapper for later jobs.

inputs:
  terraform-version:
    description: Exact Terraform CLI release version, e.g. 1.9.8. A leading v is accepted.
    required: true
  terraform-wrapper:
    description: Install the upstream wrapper exposing stdout, stderr, and exitcode outputs.
    required: false
    default: "true"
  cli-config-credentials-hostname:
    description: HCP Terraform or Terraform Enterprise credentials hostname.
    required: false
    default: app.terraform.io
  cli-config-credentials-token:
    description: API token written to the job-local Terraform CLI configuration.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether Terraform was reused without running hashicorp/setup-terraform.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: cache
      name: Reuse cached Terraform if present
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_VERSION_INPUT: ${{ inputs.terraform-version }}
        TERRAFORM_WRAPPER: ${{ inputs.terraform-wrapper }}
      run: bash "$ACTION_PATH/cache.sh" restore

    - name: Configure Terraform credentials
      if: inputs.cli-config-credentials-token != ''
      shell: bash
      env:
        TF_CREDENTIALS_HOSTNAME: ${{ inputs.cli-config-credentials-hostname }}
        TF_CREDENTIALS_TOKEN: ${{ inputs.cli-config-credentials-token }}
      run: |
        set -euo pipefail
        config_file="${TF_CLI_CONFIG_FILE:-$HOME/.terraformrc}"
        mkdir -p "$(dirname "$config_file")"
        umask 077
        printf 'credentials "%s" {\n  token = "%s"\n}\n' \
          "$TF_CREDENTIALS_HOSTNAME" "$TF_CREDENTIALS_TOKEN" > "$config_file"

    - name: Install Terraform CLI
      if: steps.cache.outputs.cache-hit != 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ steps.cache.outputs.version }}
        terraform_wrapper: ${{ inputs.terraform-wrapper }}

    - name: Save Terraform CLI to tool cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_VERSION_INPUT: ${{ inputs.terraform-version }}
        TERRAFORM_WRAPPER: ${{ inputs.terraform-wrapper }}
      run: bash "$ACTION_PATH/cache.sh" save
