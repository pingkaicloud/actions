name: setup-rust-toolchain
description: >
  One-stop Rust environment setup: restore a parameter-isolated Rust toolchain
  from the shared runner tool cache (or install it with dtolnay/rust-toolchain
  and populate the cache), and wire the job-local Cargo home to the per-repo
  NAS dependency cache (registry downloads and git DB; unpacked sources stay
  job-local) plus the optional Lindera dictionary cache.

inputs:
  toolchain:
    description: Rust toolchain specification passed to dtolnay/rust-toolchain.
    required: true
  targets:
    description: Comma-separated target triples passed to dtolnay/rust-toolchain.
    required: false
    default: ""
  target:
    description: Alias for targets, passed to dtolnay/rust-toolchain.
    required: false
    default: ""
  components:
    description: Comma-separated components passed to dtolnay/rust-toolchain.
    required: false
    default: ""
  enable-cargo-cache:
    description: >
      Link the job-local Cargo home to the per-repo NAS dependency cache.
      CARGO_HOME is always job-local under RUNNER_TEMP; this only controls
      the NAS-backed registry download and git DB links.
    required: false
    default: "true"
  cargo-cache-key:
    description: >
      Optional Cargo cache key. When omitted, uses the repository's fixed
      Cargo cache.
    required: false
    default: ""
  lindera-cache-key:
    description: >
      Lindera dictionary cache key on the runner NAS. Include the dictionary
      version when changing it. Empty disables the Lindera cache.
    required: false
    default: ""
  crates-mirror:
    description: >
      crates.io registry mirror written into the shared CARGO_HOME config.
      aliyun (default) or none to keep the official registry.
    required: false
    default: "aliyun"
  cache-lock-timeout-seconds:
    description: Maximum time to wait for a concurrent toolchain cache writer.
    required: false
    default: "1800"

outputs:
  name:
    description: Rustup name of the selected toolchain.
    value: ${{ steps.output.outputs.name }}
  cachekey:
    description: Rustc version cache key reported by dtolnay/rust-toolchain.
    value: ${{ steps.output.outputs.cachekey }}
  cache-hit:
    description: Whether the toolchain was restored from the shared tool cache.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: deps
      name: Setup Cargo and Lindera caches
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ENABLE_CARGO_CACHE: ${{ inputs.enable-cargo-cache }}
        CARGO_CACHE_KEY: ${{ inputs.cargo-cache-key }}
        LINDERA_CACHE_KEY: ${{ inputs.lindera-cache-key }}
      run: bash "${ACTION_PATH}/dependency-cache.sh"
    - name: Configure Cargo network and crates.io mirror
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CRATES_MIRROR: ${{ inputs.crates-mirror }}
      run: bash "${ACTION_PATH}/cargo-config.sh"
    - id: restore
      name: Restore Rust toolchain from tool cache
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        RUST_TARGETS: ${{ inputs.targets }}
        RUST_TARGET: ${{ inputs.target }}
        RUST_COMPONENTS: ${{ inputs.components }}
        CACHE_LOCK_TIMEOUT_SECONDS: ${{ inputs.cache-lock-timeout-seconds }}
      run: bash "${ACTION_PATH}/toolchain-cache.sh" restore

    - id: install
      name: Install Rust toolchain
      if: steps.restore.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}

    - id: save
      name: Save Rust toolchain to tool cache
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        RUST_TARGETS: ${{ inputs.targets }}
        RUST_TARGET: ${{ inputs.target }}
        RUST_COMPONENTS: ${{ inputs.components }}
        CACHE_LOCK_TIMEOUT_SECONDS: ${{ inputs.cache-lock-timeout-seconds }}
        RUST_TOOLCHAIN_NAME: ${{ steps.install.outputs.name }}
        RUST_TOOLCHAIN_CACHEKEY: ${{ steps.install.outputs.cachekey }}
      run: bash "${ACTION_PATH}/toolchain-cache.sh" save

    - id: output
      name: Export Rust toolchain outputs
      shell: bash
      run: |
        set -euo pipefail
        : "${RUST_TOOLCHAIN_NAME:?Rust toolchain name was not set}"
        : "${RUST_TOOLCHAIN_CACHEKEY:?Rust toolchain cache key was not set}"
        {
          echo "name=${RUST_TOOLCHAIN_NAME}"
          echo "cachekey=${RUST_TOOLCHAIN_CACHEKEY}"
        } >> "${GITHUB_OUTPUT}"
