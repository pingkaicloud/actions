name: nas-cache
description: >
  Per-repo dependency caches on the shared runner NAS volume.
  Go, npm, pip, Pulumi, Cargo, and Lindera caches are isolated by repository
  and optional cache key. Cache expiry must be handled by a separate job that
  coordinates with active runners.

inputs:
  go-cache-key:
    description: >
      Optional Go cache key. When omitted, uses the repository's fixed Go cache.
    default: ""
  npm-cache-key:
    description: >
      Optional npm cache key. When omitted, uses the repository's fixed npm cache.
    default: ""
  pip-cache-key:
    description: >
      Optional pip cache key. When omitted, uses the repository's fixed pip cache.
    default: ""
  pulumi-cache-key:
    description: >
      Optional Pulumi cache key (~/.pulumi/plugins symlink, holds downloaded plugins).
      When omitted, uses the repository's fixed Pulumi cache.
    default: ""
  enable-cargo-cache:
    description: >
      Enable Cargo registry and git DB caching. Cargo's cache lock files are
      shared with the cache; checkout, config, and installed binaries remain job-local.
    default: "false"
  cargo-cache-key:
    description: >
      Optional Cargo cache key. When omitted, uses the repository's fixed Cargo cache.
    default: ""
  enable-lindera-cache:
    description: >
      Enable the Lindera dictionary cache on the runner NAS.
    default: "false"
  lindera-cache-key:
    description: >
      Optional Lindera cache key. Include the dictionary version when changing it.
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve per-repo cache directories
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GO_CACHE_KEY: ${{ inputs.go-cache-key }}
        NPM_CACHE_KEY: ${{ inputs.npm-cache-key }}
        PIP_CACHE_KEY: ${{ inputs.pip-cache-key }}
        PULUMI_CACHE_KEY: ${{ inputs.pulumi-cache-key }}
        ENABLE_CARGO_CACHE: ${{ inputs.enable-cargo-cache }}
        CARGO_CACHE_KEY: ${{ inputs.cargo-cache-key }}
        ENABLE_LINDERA_CACHE: ${{ inputs.enable-lindera-cache }}
        LINDERA_CACHE_KEY: ${{ inputs.lindera-cache-key }}
      run: |
        set -euo pipefail
        bash "${ACTION_PATH}/resolve-cache-keys.sh"
